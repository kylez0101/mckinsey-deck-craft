name: Verify skill contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test calculations, charts, profiles, receipts and evaluation integrity
        run: node --test scripts/tests/*.test.mjs
      - name: Check generated contract documentation
        run: node scripts/sync-template-catalog.mjs --check
      - name: Check both complete example inputs
        run: |
          node scripts/preflight.mjs --input examples/saas-budget/source.json
          node scripts/preflight.mjs --input examples/university-service/source.json
      - name: Compile without the private presentation runtime
        run: node scripts/build-data-deck.mjs --input examples/saas-budget/source.json --workspace "$PWD" --work "$PWD/working/ci" --out "$PWD/output/ci.pptx" --dry-run
      - name: Verify published evaluation evidence
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {verifyArtifact} from './scripts/evaluate.mjs';
          const root=path.resolve('evals/results/2026-11-07-complete');
          const manifest=JSON.parse(await fs.readFile(path.join(root,'artifact-manifest.json'),'utf8'));
          for(const artifact of manifest.artifacts)await verifyArtifact({...artifact,id:artifact.path},root);
          console.log(JSON.stringify({status:'evidence_bytes_verified',files:manifest.artifacts.length}));
          JS
